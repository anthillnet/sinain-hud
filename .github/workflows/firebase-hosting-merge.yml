name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'RELEASE_VERSIONS.json'
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Node 20: firebase-tools hits "Premature close" (undici keep-alive bug)
      # under the runner-default Node 24, breaking auth/release intermittently.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The DMG download CTA points at sinain.com/download — a Cloudflare
      # Worker (tools/download-redirect) that resolves the version from
      # RELEASE_VERSIONS.json at request time. No deploy-time rendering.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINAIN_EB918 }}
          channelId: live
          projectId: sinain-eb918
