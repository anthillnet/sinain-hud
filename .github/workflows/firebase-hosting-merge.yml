name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'RELEASE_VERSIONS.json'

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Render the DMG download CTA from RELEASE_VERSIONS.json (with a
      # fallback to the newest published macos-v* release) — the committed
      # URL in docs/index.html is never authoritative.
      - name: Render download link
        run: ./tools/site/set-dmg-link.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINAIN_EB918 }}
          channelId: live
          projectId: sinain-eb918
