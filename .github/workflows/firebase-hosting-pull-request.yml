name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'firebase.json'
      - '.firebaserc'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Node 20: firebase-tools hits "Premature close" (undici keep-alive bug)
      # under the runner-default Node 24, breaking auth/release intermittently.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINAIN_EB918 }}
          projectId: sinain-eb918
