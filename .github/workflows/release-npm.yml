name: Release npm

on:
  push:
    tags:
      - 'npm-v*'
  # Callable from release.yml (unified `v*` release) — creates the
  # npm-v<version> release itself, so consumers' tag-prefix lookups
  # keep working.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to create/attach to (npm-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish @geravant/sinain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinain-hud-plugin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#npm-v}" >> "$GITHUB_OUTPUT"

      - name: Set package version from tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release (record)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
