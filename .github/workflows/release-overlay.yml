name: Release Overlay

on:
  push:
    tags:
      - 'overlay-v*'
  # Callable from release.yml (unified `v*` release) — creates the
  # overlay-v<version> release itself, so consumers' tag-prefix lookups
  # keep working.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to create/attach to (overlay-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Overlay
    runs-on: macos-latest
    defaults:
      run:
        working-directory: overlay

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec is the source of CFBundleShortVersionString — stamp it from
      # RELEASE_VERSIONS.json so the .app reports the released version.
      - name: Sync pubspec version
        run: ../tools/release/sync-overlay-version.sh

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent sinain_hud.app sinain_hud.app.zip

      - name: Upload macOS asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: overlay/build/macos/Build/Products/Release/sinain_hud.app.zip
          generate_release_notes: true

  build-windows:
    name: Build & Release Overlay (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Sync pubspec version
        shell: bash
        run: ../tools/release/sync-overlay-version.sh

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath sinain_hud_windows.zip

      - name: Upload Windows asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: overlay/sinain_hud_windows.zip
