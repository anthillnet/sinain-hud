<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Sinain</title>
<meta name="description" content="Tiny redirector that opens a Sinain concept share on your local sinain-core. Bundle data in the URL fragment is never sent to a server.">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #ffffff; color: #0f172a; margin: 0;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 24px; }
  .card { max-width: 480px; width: 100%; padding: 32px;
          border: 1px solid #e2e8f0; border-radius: 12px;
          box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08); }
  h1 { color: #2563eb; font-size: 20px; margin: 0 0 12px; }
  p { color: #475569; line-height: 1.5; margin: 8px 0; font-size: 14px; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px;
         font-family: ui-monospace, monospace; font-size: 13px; color: #0f172a; }
  .actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  button, a.btn {
    background: #2563eb; color: #ffffff; border: none; padding: 10px 16px;
    border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600;
    text-decoration: none; display: inline-block;
  }
  button:hover, a.btn:hover { background: #1d4ed8; }
  button.secondary, a.btn.secondary {
    background: #f8fafc; color: #0f172a; border: 1px solid #e2e8f0; font-weight: 500;
  }
  button.secondary:hover, a.btn.secondary:hover { background: #f1f5f9; }
  input { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0;
          border-radius: 6px; font: inherit; box-sizing: border-box; }
  label { display: block; color: #475569; font-size: 12px; margin: 12px 0 4px; }
  .small { color: #94a3b8; font-size: 12px; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <div class="card">
    <h1>Open in Sinain</h1>
    <p id="status">Redirecting to your local sinain-core…</p>
    <div id="manual" style="display:none">
      <p>This link couldn't be opened automatically. Sinain-core may not be running, or it's on a different port.</p>
      <label for="port">Sinain-core port</label>
      <input id="port" type="number" value="9500" min="1" max="65535" />
      <div class="actions">
        <button id="retry">Try again</button>
        <a id="manualLink" class="btn secondary" target="_blank">Open URL manually</a>
      </div>
      <p class="small">If you don't have sinain-core installed, get it at <a href="https://github.com/anthillnet/sinain-hud" target="_blank">github.com/anthillnet/sinain-hud</a>.</p>
    </div>
  </div>
<script>
// Tiny URL rewriter. Inputs:
//   query string ?entity=<id>&port=<n>
//   fragment    #bundle=<encoded>  OR  #peer=<token>
// Output: redirects to http://localhost:<port>/knowledge/ui/entity/<id><fragment>
//
// IMPORTANT: browsers do NOT send URL fragments to servers. The bundle/peer
// data in the hash never touches this redirector or its CDN — this page is
// pure JS that rewrites the URL on the client side.

(function() {
  const params = new URLSearchParams(location.search);
  const entity = params.get("entity") || "";
  const portStr = params.get("port") || "9500";
  const port = parseInt(portStr) || 9500;
  const hash = location.hash || "";  // includes leading #

  if (!entity || !hash) {
    document.getElementById("status").innerHTML =
      '<span class="err">Missing share data.</span> ' +
      'This link must be opened directly — copying just the link text from a ' +
      'preview-modified URL (Slack/iMessage may strip the fragment) won\'t work.';
    document.getElementById("manual").style.display = "none";
    return;
  }

  function targetUrl(p) {
    return "http://localhost:" + p + "/knowledge/ui/entity/" + entity + hash;
  }

  // Try a fast probe of /knowledge/ui (HEAD) before redirecting. If the local
  // sinain-core isn't reachable on this port, show the manual fallback.
  // CORS will block reading the response, but the network failure is detectable.
  function attempt(p) {
    document.getElementById("status").textContent = "Opening localhost:" + p + "…";
    // We can't reliably HEAD-probe due to CORS + browser fetch policies on
    // mixed http/https. Instead just navigate and let the browser handle it.
    // If localhost:<p> isn't running, the user lands on a "can't connect"
    // page — and our manual fallback below gives them a way back here.
    location.href = targetUrl(p);
  }

  document.getElementById("retry").addEventListener("click", () => {
    const p = parseInt(document.getElementById("port").value) || 9500;
    attempt(p);
  });

  // Show manual UI as a fallback after a short delay (in case redirect fails
  // silently or the user wants to override the port).
  setTimeout(() => {
    document.getElementById("manual").style.display = "block";
    document.getElementById("port").value = String(port);
    document.getElementById("manualLink").href = targetUrl(port);
  }, 600);

  attempt(port);
})();
</script>
</body>
</html>
