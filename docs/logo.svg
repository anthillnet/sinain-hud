<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sinain — pulsing eye with cat-slit pupil and radial spikes">
  <!-- Rounded-square background, landing-style blue (#2563eb) -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#2563eb"/>

  <g stroke="#ffffff" fill="#ffffff" stroke-linecap="round">
    <!-- Outer ring -->
    <circle cx="512" cy="512" r="360" fill="none" stroke-width="26"/>

    <!-- Cat-slit pupil (two quadratic Bezier curves forming a vertical lens) -->
    <path d="M 512 314 Q 576 512 512 710 Q 448 512 512 314 Z" stroke="none"/>

    <!-- 8 radial spikes at 45° intervals, outside the ring -->
    <line x1="885" y1="512" x2="965" y2="512" stroke-width="19"/>
    <line x1="776" y1="776" x2="832" y2="832" stroke-width="19"/>
    <line x1="512" y1="885" x2="512" y2="965" stroke-width="19"/>
    <line x1="248" y1="776" x2="192" y2="832" stroke-width="19"/>
    <line x1="139" y1="512" x2="59"  y2="512" stroke-width="19"/>
    <line x1="248" y1="248" x2="192" y2="192" stroke-width="19"/>
    <line x1="512" y1="139" x2="512" y2="59"  stroke-width="19"/>
    <line x1="776" y1="248" x2="832" y2="192" stroke-width="19"/>
  </g>
</svg>
