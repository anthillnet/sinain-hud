[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinain-llm"
version = "0.1.0"
description = "Unified LLM provider shim for sinain surfaces (OpenRouter / Cerebras / Ollama): fallback chains, JSON modes, prefix caching, usage/cost extraction"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["sinain_llm*"]
