<!doctype html>
<meta charset="utf-8">
<title>Sinain call engine</title>
<!--
  Hidden-webview call engine. Loaded by the overlay in an invisible
  WKWebView; everything talks to local core (same origin), which proxies
  signaling to ARSinain with the paired device token.

  Why a browser page at all: getUserMedia's processing chain (echo
  cancellation, noise suppression, auto-gain) plus WebRTC's adaptive playout
  jitter buffer are exactly what the python bridge lacks — the browser stack
  cancels Sinain's own TTS from the mic, so the server never talks to itself
  and barge-in works. Same mechanics as the proven ARSinain web client; the
  only twist is the screen track: sck-capture frames polled from core and
  drawn onto a captured canvas (no getDisplayMedia picker).
-->
<body>
<audio id="tts" autoplay></audio>
<canvas id="screen"></canvas>
<script>
"use strict";
const FPS = 4;

function report(status, error) {
  return fetch("/voice/engine", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(error ? { status, error } : { status }),
  }).catch(() => {});
}

async function iceServers() {
  try {
    const r = await fetch("/voice/turn");
    const d = await r.json();
    if (d && d.iceServers) return d.iceServers;
  } catch (e) { /* fall through */ }
  return [{ urls: "stun:stun.l.google.com:19302" }];
}

// Screen track: poll core's frame endpoint, draw to canvas, capture the
// canvas. requestFrame() after each draw forces a capture even though the
// webview is invisible (no rAF/paint cycle to piggyback on).
function startScreenTrack() {
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  let stopped = false;
  (async function poll() {
    while (!stopped) {
      const t0 = Date.now();
      try {
        const r = await fetch("/voice/frame", { cache: "no-store" });
        if (r.ok) {
          const bmp = await createImageBitmap(await r.blob());
          if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
            canvas.width = bmp.width;
            canvas.height = bmp.height;
          }
          ctx.drawImage(bmp, 0, 0);
          bmp.close();
          if (track.requestFrame) track.requestFrame();
        }
      } catch (e) { /* keep last frame */ }
      const dt = 1000 / FPS - (Date.now() - t0);
      await new Promise((res) => setTimeout(res, Math.max(50, dt)));
    }
  })();
  track.addEventListener("ended", () => { stopped = true; });
  return stream;
}

async function start() {
  let mic;
  try {
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    return report("error", "microphone unavailable: " + (e.message || e.name));
  }

  const pc = new RTCPeerConnection({ iceServers: await iceServers() });
  mic.getTracks().forEach((t) => pc.addTrack(t, mic));
  const screen = startScreenTrack();
  screen.getVideoTracks().forEach((t) => pc.addTrack(t, screen));

  // TTS playback THROUGH the media element keeps it inside the browser's
  // audio graph — the far-end reference the echo canceller subtracts.
  pc.ontrack = (e) => {
    if (e.track.kind === "audio") {
      document.getElementById("tts").srcObject = new MediaStream([e.track]);
    }
  };

  const dc = pc.createDataChannel("meta");
  dc.onopen = async () => {
    let seed = {};
    try { seed = await (await fetch("/voice/seed")).json(); } catch (e) { /* unseeded */ }
    // caps announces desktop-directive support — the server only advertises
    // MEMORY:/REMEMBER:/HANDOFF: to the LLM when it sees this.
    dc.send(JSON.stringify({
      type: "seed", text: seed.text || "", say: seed.say || "", caps: ["directives"],
    }));
    report("live");
  };
  // Desktop directive from the cloud brain: execute on core, answer back up
  // the channel. Core does the work (memory lookup / store / thread handoff);
  // the cloud phrases and speaks the result.
  async function runDirective(m) {
    let result = { ok: false, error: "core unreachable" };
    try {
      const r = await fetch("/voice/directive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: m.id, name: m.name, arg: m.arg, transcript: m.transcript }),
      });
      result = await r.json();
    } catch (err) { result = { ok: false, error: String(err).slice(0, 200) }; }
    try { dc.send(JSON.stringify({ type: "directive_result", id: m.id, ...result })); } catch (err) { /* channel closed */ }
  }
  // Live captions: the server relays every spoken line as {type:"say"} —
  // forward to core, which puts it on the HUD call chip.
  dc.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === "directive" && m.name) {
        runDirective(m);
      } else if (m.type === "say" && m.text) {
        fetch("/voice/engine", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "live", caption: String(m.text) }),
        }).catch(() => {});
      }
    } catch (err) { /* non-JSON meta — ignore */ }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "failed") report("error", "connection failed");
    else if (pc.connectionState === "closed" || pc.connectionState === "disconnected") report("ended");
  };

  // Control loop: core owns Mute and End (the chip's buttons) — poll and obey.
  (async function ctlLoop() {
    while (pc.connectionState !== "closed") {
      try {
        const c = await (await fetch("/voice/ctl", { cache: "no-store" })).json();
        mic.getAudioTracks().forEach((t) => { t.enabled = !c.muted; });
        if (c.end) { pc.close(); break; }
      } catch (e) { /* core briefly unreachable — keep the call */ }
      await new Promise((res) => setTimeout(res, 800));
    }
  })();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((res) => {  // non-trickle: wait for ICE gathering
    if (pc.iceGatheringState === "complete") return res();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && res();
    setTimeout(res, 3000);  // gather what we have — host candidates suffice
  });

  const r = await fetch("/voice/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    return report("error", err.error || "signaling failed (" + r.status + ")");
  }
  await pc.setRemoteDescription(await r.json());
}

start().catch((e) => report("error", String(e.message || e)));
</script>
</body>
