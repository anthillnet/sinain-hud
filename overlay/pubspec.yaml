name: sinain_hud
description: SinainHUD - Ghost overlay for macOS
publish_to: 'none'
version: 2.11.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  window_manager: ^0.3.7
  flutter_acrylic: ^1.1.3
  hotkey_manager: ^0.2.0
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.0
  # Thread-terminal spike: pure-Flutter terminal emulator + native PTY.
  # Both MIT, both terminal.studio. Pure Flutter = renders inside the private
  # NSPanel, so capture-invisibility is inherited (no platform view needed).
  xterm: ^4.0.0
  flutter_pty: ^0.4.1
  # Chat-threads redesign: flyer chat (Apache-2.0, flyer.chat) renders every
  # thread's chat surface. Pure Flutter — same invisibility argument.
  flutter_chat_ui: ^2.11.0
  flutter_chat_core: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    # Brand eye animation (Manim render) for the onboarding tour's welcome scene.
    - assets/sinain_eye.webp
  # Uncomment after placing JetBrains Mono TTF files in fonts/
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: fonts/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
